[project]
name = "fastapi-auth-token-rotation-python"
version = "0.1.0"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "pyjwt>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "httpx>=0.28",
]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
